<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cart — Ghor Mart</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      li { margin: 8px 0; }
    </style>
  </head>
  <body class="woocommerce-cart">
    <p><a href="/demo/woo/">← Shop</a></p>
    <h1>Cart</h1>
    <p class="muted">This is a local Woo stand-in. Add-to-cart uses <code>/?add-to-cart={id}</code> like classic Woo.</p>
    <ul id="lines"></ul>
    <script>
      const catalog = {
        "101": "Copper lota",
        "102": "Mustard oil 1L",
        "103": "Clay kulhar set",
      };
      const match = document.cookie.match(/(?:^|; )bdagent_woo_cart=([^;]*)/);
      const ids = match ? decodeURIComponent(match[1]).split(",").filter(Boolean) : [];
      const ul = document.getElementById("lines");
      if (!ids.length) ul.innerHTML = "<li>Cart is empty.</li>";
      else ids.forEach((id) => {
        const li = document.createElement("li");
        li.textContent = (catalog[id] || "Product") + " (#" + id + ")";
        ul.appendChild(li);
      });
    </script>
    <script src="/widget.js" data-token="wgt_local_woo_token_abcdefghijk123" async></script>
  </body>
</html>
